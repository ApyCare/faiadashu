name: faiadashu
description: Faiadashu FHIRDash - Build beautiful healthcare apps fast — use the Flutter™ SDK and follow the HL7® FHIR® standard.
version: 0.11.14
homepage: https://tiloc.github.io/faiadashu/
repository: https://github.com/tiloc/faiadashu
issue_tracker: https://github.com/tiloc/faiadashu/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  collection: ^1.19.1
  html: ^0.15.0
  fhir: ^0.12.0
  fhir_path: ^0.12.0
  file_selector: ^1.0.3
  filesize: ^2.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_widget_from_html_core: ^0.15.2
  intl: ^0.19.0
  logging: ^1.3.0
  markdown: ^7.3.0
  meta: ^1.7.0
  mime: ^2.0.0
  scrollable_positioned_list: ^0.3.8
  simple_html_css: ^5.0.0
  webview_flutter: ^4.13.0
  webview_flutter_web: ^0.2.3+4

dependency_overrides:
  intl: ^0.19.0
  lint: ^2.3.0

flutter:
  generate: true
  uses-material-design: true